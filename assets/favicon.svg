<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Monitor Laboral Chile">
  <title>Monitor Laboral Chile</title>

  <!-- Fondo: azul institucional --azul-oscuro -->
  <rect width="64" height="64" rx="14" fill="#0e3a5d"/>

  <!-- Gauge: pista completa del semicírculo (atenuada) -->
  <path d="M 12 42 A 20 20 0 0 1 52 42"
        stroke="#1d4f7a" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Gauge: segmento verde (nivel bajo / moderado) -->
  <path d="M 12 42 A 20 20 0 0 1 22 24.7"
        stroke="#2e7d52" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Gauge: segmento ámbar (nivel elevado, ICML actual) -->
  <path d="M 22 24.7 A 20 20 0 0 1 42 24.7"
        stroke="#c98a1b" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Aguja apuntando al rango "elevado" (~60% del arco) -->
  <line x1="32" y1="42" x2="38" y2="23"
        stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Pivote central -->
  <circle cx="32" cy="42" r="3.5" fill="#ffffff"/>
</svg>
